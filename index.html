<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>3D Fruit Shapes</title>\n    <style>\n        body {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            background: #fff;\n            overflow: hidden;\n        }\n        .fruit {\n            position: absolute;\n            animation: float 3s ease-in-out infinite;\n        }\n        @keyframes float {\n            0% { transform: translateY(0); }\n            50% { transform: translateY(-20px); }\n            100% { transform: translateY(0); }\n        }\n    </style>\n</head>\n<body>\n    <div class="fruit" id="apple"></div>\n    <div class="fruit" id="strawberry"></div>\n    <div class="fruit" id="orange"></div>\n    <div class="fruit" id="banana"></div>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>\n    <script>\n        const scene = new THREE.Scene();\n        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);\n        const renderer = new THREE.WebGLRenderer();\n        renderer.setSize(window.innerWidth, window.innerHeight);\n        document.body.appendChild(renderer.domElement);\n\n        // Load fruit shapes and textures here\n        const loader = new THREE.JSONLoader();\n        loader.load('path/to/apple.json', function (geometry, materials) {\n            let apple = new THREE.Mesh(geometry, materials);\n            apple.position.set(-1.5, 0, 0);\n            scene.add(apple);\n        });\n        // Repeat for strawberry, orange, and banana\n\n        camera.position.z = 5;\n\n        function animate() {\n            requestAnimationFrame(animate);\n            renderer.render(scene, camera);\n        }\n        animate();\n    </script>\n</body>\n</html>
